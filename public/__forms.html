<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Netlify Forms Hidden Definitions</title>
  </head>
  <body style="display:none;">
    <!-- Newsletter Subscription Form (hidden for Netlify detection) -->
    <form
      name="newsletter"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <!-- Hidden field required by Netlify to identify the form -->
      <input type="hidden" name="form-name" value="newsletter" />
      <!-- Honeypot field (bot-field) -->
      <input type="hidden" name="bot-field" />
      <!-- Actual visible field from the React component -->
      <input type="email" name="email" required />
    </form>

    <!-- Enquiry Form (hidden for Netlify detection) -->
    <form
      name="enquiry"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="enquiry" />
      <input type="hidden" name="bot-field" />
      <input type="text" name="name" required />
      <input type="tel" name="phone" required />
      <input type="email" name="email" />
      <select name="capital" required>
        <option value="" disabled>Select Capital Range*</option>
        <option value="₹1L–₹5L">₹1L – ₹5L</option>
        <option value="₹5L–₹25L">₹5L – ₹25L</option>
        <option value="₹25L–₹1Cr">₹25L – ₹1Cr</option>
        <option value="₹1Cr+">₹1Cr+</option>
      </select>
      <select name="experience" required>
        <option value="" disabled>Trading Experience</option>
        <option value="Beginner">Beginner (&lt; 1 Year)</option>
        <option value="Intermediate">Intermediate (1-3 Years)</option>
        <option value="Advanced">Advanced (3+ Years)</option>
      </select>
      <textarea name="goal" placeholder="Your Primary Goal"></textarea>
    </form>
  </body>
</html>
